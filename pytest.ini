[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: fast checks that do not require the trained model
    regression: guards against previously fixed defects
    security: whitelist / attack-surface related tests
    integration: end-to-end tests requiring model + whitelist
    boundary: boundary-value analysis cases
    known_limitation: documented accepted limitations (xfail)
